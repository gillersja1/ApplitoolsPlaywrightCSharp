name: Applitools Visual Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  visual-tests:
    name: Applitools Visual Tests
    runs-on: ubuntu-latest
    env:
      APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
      APPLITOOLS_BATCH_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Install Playwright browsers
        run: pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run visual tests
        run: >
          dotnet test --no-build
          --logger "trx;LogFileName=visual-test-results.trx"
          --results-directory ./TestResults

      - name: Send test results to Grafana
        if: always()
        uses: gillersja1/test-results-otel@v1
        with:
          results: TestResults/*.trx
          suite: visual
          otlp-endpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otlp-headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applitools-test-results
          path: ./TestResults
